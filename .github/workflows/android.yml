# Construit l'APK Android d'Onílé sur GitHub (gratuit), signé avec la MÊME clé que les builds Expo :
# les téléphones peuvent installer la mise à jour par-dessus, sans perdre leurs données.
#
# Déclenchement : onglet Actions → « APK Android » → Run workflow (ou en poussant un tag v1.0.6…).
# Résultat : une release GitHub « vX.Y.Z » avec l'APK (lien permanent), puis, si ONILE_API_URL et
# ADMIN_TOKEN sont configurés, la version est enregistrée : le site et l'application la proposent.
#
# Secrets à créer (Settings → Secrets and variables → Actions) — voir docs/BUILD-GITHUB.md :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_API_URL (facultatifs)
#   ONILE_API_URL, ADMIN_TOKEN (facultatifs : publication automatique de la version)
name: APK Android

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Notes de version (affichées dans l'application)
        required: false
        default: ''
      publier:
        description: Enregistrer la version dans l'API (site + alerte de mise à jour)
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : voir docs/BUILD-GITHUB.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        # Le réseau de npm coupe parfois (ECONNRESET) : jusqu'à 3 essais.
        run: |
          for essai in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci a échoué (essai $essai), nouvel essai dans 20 s…"; sleep 20
          done
          exit 1

      - name: Version
        id: version
        run: |
          echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./app.json').expo.android.versionCode")" >> "$GITHUB_OUTPUT"

      - name: Projet Android natif (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/onile.keystore"

      - name: Construire l'APK signé
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/onile.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/onile-${{ steps.version.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/onile.keystore"

      - name: APK en pièce jointe du workflow
        uses: actions/upload-artifact@v4
        with:
          name: onile-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/onile-${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # Le versionCode entre parenthèses sert au secours GitHub (site, API et application).
          name: Onílé ${{ steps.version.outputs.version }} (${{ steps.version.outputs.code }})
          body: ${{ github.event.inputs.notes || format('Onílé {0}', steps.version.outputs.version) }}
          files: ${{ runner.temp }}/onile-${{ steps.version.outputs.version }}.apk
          make_latest: true

      - name: Publier la version (site + alerte de mise à jour)
        if: ${{ github.event_name == 'push' || github.event.inputs.publier == 'true' }}
        env:
          ONILE_API_URL: ${{ secrets.ONILE_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -z "$ONILE_API_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "ONILE_API_URL / ADMIN_TOKEN absents : version non enregistrée (l'APK est quand même dans la release)."
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/onile-${{ steps.version.outputs.version }}.apk"
          BODY=$(node -e "console.log(JSON.stringify({version: process.argv[1], version_code: Number(process.argv[2]), url_apk: process.argv[3], notes: process.env.NOTES || null}))" \
            "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.code }}" "$URL")
          # Render peut dormir : on réessaie le temps qu'il se réveille.
          for i in 1 2 3 4 5; do
            STATUT=$(curl -s -o /tmp/reponse -w '%{http_code}' -X POST "$ONILE_API_URL/api/versions" \
              -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' -d "$BODY")
            if [ "$STATUT" = "201" ]; then echo "Version publiée : $URL"; exit 0; fi
            echo "Tentative $i : HTTP $STATUT"; sleep 20
          done
          cat /tmp/reponse
          echo "::warning::API injoignable : version non enregistrée. La release GitHub sera proposée par le secours (site, API et application)." 
